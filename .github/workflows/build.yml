name: Build

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating System to build for'
        required: true
        type: choice
        options:
          - all
          - macos-aarch64
          - macos-x86_64
          - linux-x86_64
          - windows-x86_64
        default: 'all'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
            build_name: "macos-aarch64"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
            build_name: "macos-x86_64"
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu"
            target: "x86_64-unknown-linux-gnu"
            build_name: "linux-x86_64"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            target: "x86_64-pc-windows-msvc"
            build_name: "windows-x86_64"
    
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check if build should run
        id: should_run
        run: |
          if [[ "${{ inputs.os }}" == "all" ]] || [[ "${{ inputs.os }}" == "${{ matrix.build_name }}" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - uses: actions/checkout@v4
        if: steps.should_run.outputs.run == 'true'

      - name: Setup pnpm
        if: steps.should_run.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.should_run.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: "pnpm"

      - name: Setup Rust
        if: steps.should_run.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: steps.should_run.outputs.run == 'true' && matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev pkg-config xdg-utils

      - name: Rust cache
        if: steps.should_run.outputs.run == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workdir: ./src-tauri

      - name: Install frontend dependencies
        if: steps.should_run.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        if: steps.should_run.outputs.run == 'true'
        run: pnpm exec next build

      - name: Verify frontend dist exists
        if: steps.should_run.outputs.run == 'true'
        shell: bash
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html not found after build"
            ls -la dist 2>/dev/null || ls -la
            exit 1
          fi
          echo "Frontend dist verified"

      - name: Build sidecar binaries
        if: steps.should_run.outputs.run == 'true'
        shell: bash
        working-directory: ./src-tauri
        run: |
          cargo build --bin donut-proxy --target ${{ matrix.target }} --release

      - name: Copy sidecar binaries to Tauri binaries
        if: steps.should_run.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            cp src-tauri/target/${{ matrix.target }}/release/donut-proxy.exe src-tauri/binaries/donut-proxy-${{ matrix.target }}.exe
          else
            cp src-tauri/target/${{ matrix.target }}/release/donut-proxy src-tauri/binaries/donut-proxy-${{ matrix.target }}
            chmod +x src-tauri/binaries/donut-proxy-${{ matrix.target }}
          fi

      - name: Build Tauri app
        if: steps.should_run.outputs.run == 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ./src-tauri
          args: ${{ matrix.args }}

      - name: Upload artifacts
        if: steps.should_run.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 7
